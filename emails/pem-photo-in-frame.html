%%[
  SET @PEM_Photo = AttributeValue("PEM_Photo")
]%%
<!--
  PEM photo (dynamic) inside ellipse frame
  Frame + 3 spheres drawn with HTML/CSS/VML — NO external frame image needed
  Photo: 184x163 | Outer: 224x167
-->
<!--[if mso]>
<style type="text/css">
  table { border-collapse: collapse; }
</style>
<![endif]-->
<style type="text/css">
  .pem-frame-wrap {
    position: relative !important;
    width: 224px !important;
    height: 167px !important;
    display: inline-block !important;
  }
  .pem-photo {
    position: absolute !important;
    left: 20px !important;
    top: 2px !important;
    display: block !important;
    width: 184px !important;
    height: 163px !important;
    border: 0 !important;
    border-radius: 70px !important;
    object-fit: cover !important;
    z-index: 1 !important;
  }
  .pem-ring {
    position: absolute !important;
    left: 18px !important;
    top: 0 !important;
    width: 188px !important;
    height: 167px !important;
    border: 3px solid #F5A623 !important;
    border-radius: 80px !important;
    box-sizing: border-box !important;
    z-index: 2 !important;
    pointer-events: none !important;
  }
  .pem-orb {
    position: absolute !important;
    border-radius: 50% !important;
    z-index: 3 !important;
    background: radial-gradient(circle at 35% 30%, #FFE08A 0%, #FF9A3C 45%, #E85A20 100%) !important;
  }
  .pem-orb-tl { width: 42px !important; height: 42px !important; left: 8px !important; top: 0 !important; }
  .pem-orb-br { width: 48px !important; height: 48px !important; right: 4px !important; bottom: 0 !important; left: auto !important; top: auto !important; }
  .pem-orb-sm { width: 18px !important; height: 18px !important; left: 118px !important; bottom: 6px !important; top: auto !important; }
</style>

<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="224" height="167" style="width:224px; height:167px; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
  <tr>
    <td align="center" valign="middle" width="224" height="167" style="width:224px; height:167px; font-size:0; line-height:0;">

      <!-- ========== OUTLOOK (Windows) : VML frame + orbs + photo ========== -->
      <!--[if gte mso 9]>
      <v:group xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" coordsize="224,167" coordorigin="0,0" style="width:224px; height:167px; position:relative;">

        <!-- Photo clipped to rounded rect -->
        <v:roundrect style="position:absolute; left:20; top:2; width:184; height:163; z-index:1;" arcsize="4200f" stroked="false" filled="true">
          <v:fill type="frame" src="%%=v(@PEM_Photo)=%%" color="#333333" />
        </v:roundrect>

        <!-- Orange ellipse ring -->
        <v:roundrect style="position:absolute; left:18; top:0; width:188; height:167; z-index:2;" arcsize="4500f" filled="false" strokecolor="#F5A623" strokeweight="3px">
          <v:stroke color="#F5A623" weight="3px" />
        </v:roundrect>

        <!-- Orb top-left -->
        <v:oval style="position:absolute; left:8; top:0; width:42; height:42; z-index:3;" stroked="false" filled="true">
          <v:fill type="gradient" color="#E85A20" color2="#FFE08A" angle="135" />
        </v:oval>

        <!-- Orb bottom-right -->
        <v:oval style="position:absolute; left:172; top:119; width:48; height:48; z-index:3;" stroked="false" filled="true">
          <v:fill type="gradient" color="#E85A20" color2="#FFE08A" angle="135" />
        </v:oval>

        <!-- Orb small bottom -->
        <v:oval style="position:absolute; left:118; top:143; width:18; height:18; z-index:3;" stroked="false" filled="true">
          <v:fill type="gradient" color="#E85A20" color2="#FFE08A" angle="135" />
        </v:oval>

      </v:group>
      <![endif]-->

      <!-- ========== GMAIL / APPLE / YAHOO / ANDROID / OUTLOOK.com ========== -->
      <!--[if !mso]><!-->
      <div class="pem-frame-wrap" style="display:inline-block; position:relative; width:224px; height:167px;">

        <!-- Dynamic doctor photo from DE -->
        <img class="pem-photo" src="%%=v(@PEM_Photo)=%%" alt="PEM Headshot" width="184" height="163" border="0" style="position:absolute; left:20px; top:2px; display:block; width:184px; height:163px; border:0; border-radius:70px; object-fit:cover; z-index:1;" />

        <!-- Ellipse ring (no external image) -->
        <div class="pem-ring" style="position:absolute; left:18px; top:0; width:188px; height:167px; border:3px solid #F5A623; border-radius:80px; box-sizing:border-box; z-index:2;"></div>

        <!-- 3 ellipse orbs (no external image) -->
        <div class="pem-orb pem-orb-tl" style="position:absolute; left:8px; top:0; width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFE08A 0%, #FF9A3C 45%, #E85A20 100%); z-index:3;"></div>
        <div class="pem-orb pem-orb-br" style="position:absolute; right:4px; bottom:0; left:auto; top:auto; width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFE08A 0%, #FF9A3C 45%, #E85A20 100%); z-index:3;"></div>
        <div class="pem-orb pem-orb-sm" style="position:absolute; left:118px; bottom:6px; top:auto; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFE08A 0%, #FF9A3C 45%, #E85A20 100%); z-index:3;"></div>

      </div>
      <!--<![endif]-->

    </td>
  </tr>
</table>
