%%[
  SET @PEM_Photo = AttributeValue("PEM_Photo")
]%%
<!--[if mso]>
<xml>
  <o:OfficeDocumentSettings>
    <o:AllowPNG/>
    <o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings>
</xml>
<style type="text/css">
  table { border-collapse: collapse; }
</style>
<![endif]-->
<style type="text/css">
  .pem-stage { display: inline-block !important; position: relative !important; width: 224px !important; height: 167px !important; background-color: #EB7231 !important; }
  .pem-photo {
    position: absolute !important;
    left: 20px !important;
    top: 2px !important;
    width: 184px !important;
    height: 163px !important;
    display: block !important;
    border: 0 !important;
    border-radius: 81px !important;
    object-fit: cover !important;
    object-position: center center !important;
    z-index: 1 !important;
    background-color: #EB7231 !important;
  }
  .pem-frame {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 224px !important;
    height: 167px !important;
    display: block !important;
    border: 0 !important;
    z-index: 2 !important;
  }
</style>

<!--
  Image 2 look:
  - Photo CLIPPED to rounded shape (not a white rectangle)
  - Orange #EB7231 shows around (no white box)
  - Static frame PNG (orbs + ring) on top
-->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="640" align="center" bgcolor="#EB7231" style="width:640px; max-width:640px; margin:0 auto; border-collapse:collapse; background-color:#EB7231;">
  <tr>
    <td align="left" valign="top" bgcolor="#EB7231" style="padding:29px 36px 0 35px; background-color:#EB7231;">

      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="224" height="167" bgcolor="#EB7231" style="width:224px; height:167px; border-collapse:collapse; background-color:#EB7231;">
        <tr>
          <td width="224" height="167" valign="top" bgcolor="#EB7231" style="width:224px; height:167px; background-color:#EB7231; font-size:0; line-height:0;">

            <!-- ========== OUTLOOK: roundrect clips photo ========== -->
            <!--[if gte mso 9]>
            <v:group xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" coordsize="224,167" coordorigin="0,0" style="width:224px; height:167px;">
              <!-- Rounded clipped dynamic photo -->
              <v:roundrect style="position:absolute; left:20; top:2; width:184; height:163; z-index:1;" arcsize="5000f" stroked="false" filled="true">
                <v:fill type="frame" src="%%=v(@PEM_Photo)=%%" color="#EB7231" />
              </v:roundrect>
              <!-- Static transparent frame (orbs + ring) -->
              <v:image src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/ca9c25b9-33e0-4df4-9a7d-8c6aed680435.png" style="position:absolute; left:0; top:0; width:224px; height:167px; z-index:2;" />
            </v:group>
            <![endif]-->

            <!-- ========== GMAIL / APPLE / YAHOO / ANDROID ========== -->
            <!--[if !mso]><!-->
            <div class="pem-stage" style="display:inline-block; position:relative; width:224px; height:167px; background-color:#EB7231;">
              <!-- Dynamic photo — rounded clip removes white box corners -->
              <img class="pem-photo" src="%%=v(@PEM_Photo)=%%" alt="PEM Headshot" width="184" height="163" border="0" style="position:absolute; left:20px; top:2px; width:184px; height:163px; display:block; border:0; border-radius:81px; object-fit:cover; object-position:center center; z-index:1; background-color:#EB7231;" />
              <!-- Static frame on top -->
              <img class="pem-frame" src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/ca9c25b9-33e0-4df4-9a7d-8c6aed680435.png" alt="" width="224" height="167" border="0" style="position:absolute; left:0; top:0; width:224px; height:167px; display:block; border:0; z-index:2;" />
            </div>
            <!--<![endif]-->

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
