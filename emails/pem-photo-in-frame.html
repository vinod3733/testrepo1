%%[
  SET @PEM_Photo = AttributeValue("PEM_Photo")
]%%
<!--[if mso]>
<xml>
  <o:OfficeDocumentSettings>
    <o:AllowPNG/>
    <o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings>
</xml>
<style type="text/css">
  table { border-collapse: collapse; }
  td { border-collapse: collapse; }
</style>
<![endif]-->

<!--
  BULLETPROOF overlay (works Outlook + Gmail + Apple Mail):
  - Dynamic PEM photo = TD background (+ VML fill for Outlook)
  - Static transparent frame PNG = foreground <img>
  Photo shows through the transparent hole in the frame.
-->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="640" align="center" bgcolor="#EB7231" style="width:640px; max-width:640px; margin:0 auto; border-collapse:collapse; background-color:#EB7231; mso-table-lspace:0pt; mso-table-rspace:0pt;">
  <tr>
    <td align="left" valign="top" bgcolor="#EB7231" style="padding:29px 36px 0 35px; background-color:#EB7231;">

      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="224" style="width:224px; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
        <tr>
          <td background="%%=v(@PEM_Photo)=%%" bgcolor="#EB7231" width="224" height="167" valign="top" style="width:224px; height:167px; background-color:#EB7231; background-image:url('%%=v(@PEM_Photo)=%%'); background-repeat:no-repeat; background-position:center center; background-size:184px 163px;">

            <!--[if gte mso 9]>
            <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:224px; height:167px;">
              <v:fill type="frame" src="%%=v(@PEM_Photo)=%%" color="#EB7231" />
              <v:textbox inset="0,0,0,0">
            <![endif]-->

            <div>
              <!-- Static transparent frame (orange border + 3 orbs only) -->
              <img src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/ca9c25b9-33e0-4df4-9a7d-8c6aed680435.png" width="224" height="167" alt="" border="0" style="display:block; width:224px; height:167px; border:0; outline:none; text-decoration:none;" />
            </div>

            <!--[if gte mso 9]>
              </v:textbox>
            </v:rect>
            <![endif]-->

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
