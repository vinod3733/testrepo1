%%[
  /* Dynamic PEM photo from Data Extension */
  SET @PEM_Photo = AttributeValue("PEM_Photo")
  /* After upload to SFMC Image Library, set full hosted URL: */
  SET @PEM_Frame = "FRAME_URL"
]%%
<!--
  Image 1 (frame template): 224 x 167  → @PEM_Frame (static)
  Image 2 (doctor photo):   184 x 163  → %%=v(@PEM_Photo)=%% (dynamic)
  Centered: left 20px, top 2px   |  Works Outlook + Gmail + Apple Mail
-->
