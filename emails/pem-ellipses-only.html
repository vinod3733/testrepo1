<!-- IMAGE ONLY: PEM photo + 3 ellipses | no Meet text | no pink lines | no div -->

  <tr>
    <td align="left" valign="top" bgcolor="#EB7231" style="padding:29px 376px 0 27px; background-color:#EB7231;">

      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="237" height="181" bgcolor="#EB7231" style="width:237px; height:181px; border-collapse:collapse; background-color:#EB7231;">
        <tr>
          <td width="237" height="181" valign="top" bgcolor="#EB7231" style="position:relative; width:237px; height:181px; background-color:#EB7231; font-size:0; line-height:0;">

            <!-- OUTLOOK: VML photo + ellipses -->
            <!--[if gte mso 9]>
            <v:group xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" coordsize="237,181" coordorigin="0,0" style="width:237px; height:181px;">
              <v:roundrect style="position:absolute; left:25; top:9; width:187; height:163; z-index:1;" arcsize="4800f" stroked="false" filled="true">
                <v:fill type="frame" src="%%=v(@PEM_Photo)=%%" color="#EB7231" />
              </v:roundrect>
              <v:image src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/7f8a7db5-2d00-4f92-a00a-ca260c3dcbea.png" style="position:absolute; left:8; top:6; width:47px; height:48px; z-index:3;" />
              <v:image src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/7f8a7db5-2d00-4f92-a00a-ca260c3dcbea.png" style="position:absolute; left:177; top:103; width:53px; height:53px; z-index:3;" />
              <v:image src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/7f8a7db5-2d00-4f92-a00a-ca260c3dcbea.png" style="position:absolute; left:154; top:146; width:21px; height:20px; z-index:3;" />
            </v:group>
            <![endif]-->

            <!-- GMAIL / APPLE / YAHOO / ANDROID -->
            <!--[if !mso]><!-->

            <!-- In-flow photo (always visible; holds stage open) — pad 9/25/9/25 around 187x163 -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="237" height="181" style="width:237px; height:181px; border-collapse:collapse;">
              <tr>
                <td colspan="3" height="9" style="height:9px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
              <tr>
                <td width="25" height="163" style="width:25px; height:163px; font-size:0; line-height:0;">&nbsp;</td>
                <td width="187" height="163" style="width:187px; height:163px; font-size:0; line-height:0;">
                  <img src="%%=v(@PEM_Photo)=%%" alt="PEM Headshot" width="187" height="163" border="0" style="display:block; width:187px; height:163px; border:0; border-radius:78px; object-fit:cover;" />
                </td>
                <td width="25" height="163" style="width:25px; height:163px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
              <tr>
                <td colspan="3" height="9" style="height:9px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
            </table>

            <!-- Ellipse overlays (on top of photo) -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="47" height="48" style="position:absolute; left:8px; top:6px; width:47px; height:48px; border-collapse:collapse; z-index:3;">
              <tr>
                <td style="font-size:0; line-height:0;">

            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="53" height="53" style="position:absolute; left:177px; top:103px; width:53px; height:53px; border-collapse:collapse; z-index:3;">
              <tr>
                <td style="font-size:0; line-height:0;">
                  <img src="https://image.ps.alexion.com/lib/fe2f11717064057e711376/m/1/7f8a7db5-2d00-4f92-a00a-ca260c3dcbea.png" width="53" height="53" alt="" border="0" style="display:block; border:0;" />

                </td>

            </table>

          </td>
